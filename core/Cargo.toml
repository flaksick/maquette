[package]
name = "maquette-core"
version = "0.0.1"
edition = "2024"
description = "Maquette sculpting engine core (runs on the iPad via WebAssembly; tested natively)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 2
