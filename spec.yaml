  - {id: TOP-10, tier: R, phase: P4, name: Detail projection, done_when: "Project a source mesh's detail onto the active mesh or level; Hausdorff to source <= 0.2%", test: unit}
  - {id: FLT-1, tier: R, phase: P3, name: Mesh filters, done_when: "Smooth, inflate, scale, sphere, relax, sharpen, enhance details, random; mask-respecting; sliced", test: unit}
  - {id: FLT-2, tier: N, phase: P5, name: Color filters, done_when: "Fill, HSV, brightness/contrast", test: unit}

  # ---------- MSK / XFM / BOO ----------
