  - {id: NAV-1, tier: D, phase: P1a, name: Orbit / pan / zoom, done_when: "Turntable orbit (1 finger), pan (2), pinch zoom about the touch point, pivot on the surface; 60 fps at the measured comfortable polycount", test: "frame-barcode harness"}
  - {id: NAV-2, tier: D, phase: P1a, note: "buttons in P1a, taps in P1b", name: Undo / redo gestures and buttons, done_when: "2-finger tap = undo (< 250 ms, < 10 px, never inside a pinch); buttons always shown; 3-finger redo only if S6 shows the system Undo bar stays away", test: "0 false fires on 50 recorded pinch traces"}
  - {id: NAV-3, tier: D, phase: P1a, name: "Pencil sculpts, fingers navigate", done_when: "Touches ignored while the pen is down; 'finger sculpts' option", test: e2e}
  - {id: NAV-4, tier: D, phase: P1a, note: "frame/reset in P1a; view cube, ortho, FOV in P3", name: View tools, done_when: "Frame, reset, view-cube snaps, ortho/persp, FOV", test: e2e}
  - {id: NAV-5, tier: D, phase: P2, name: Hold modifiers, done_when: "Smooth / Invert / Mask hold-buttons (Pencil double-tap, squeeze and barrel roll are not exposed to the web)", test: e2e}
  - {id: NAV-6, tier: D, phase: P1a, name: Radius and strength sliders, done_when: "Edge sliders with live cursor preview", test: e2e}
  - {id: NAV-7, tier: R, phase: P3, name: Hardware keyboard, done_when: "Smooth/invert modifiers, undo/redo, radius, brush hotkeys", test: e2e}
  - {id: NAV-8, tier: R, phase: P7, name: Pencil hover cursor, done_when: "Deferred: cannot be verified on the reference device", test: "-"}
  - {id: NAV-9, tier: R, phase: P5, name: "Left-handed layout, UI scale", done_when: "Mirrored layout and UI scale persist", test: e2e}
  - {id: NAV-10, tier: D, phase: P1b, name: Gesture card, done_when: "Shown on first run; re-openable", test: e2e}
  - {id: NAV-11, tier: R, phase: P2, name: Adaptive render scale, done_when: "Lower resolution while interacting if under 60 fps; full when idle", test: "frame harness"}

