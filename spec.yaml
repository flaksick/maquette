  # ---------- TOP / FLT ----------
  - {id: TOP-1, tier: D, phase: P2, name: Voxel remesh, done_when: "Target-polycount slider + voxel checker preview; watertight with 0 non-manifold across 1,000 fuzz shapes; Hausdorff <= 1 voxel; fills holes and merges self-intersections; keep-sharp reproject; mask/color reprojected; 500k-quad output <= 4 s on the reference device; sliced, cancellable, view stays live", test: "fuzz + device perf"}
