# Maquette feature registry: the single source of truth for what the app must do.
# SPEC.md is generated from this file (`npm run spec`). Status is computed from tagged test
# results and device reports, never written here. Tiers: D daily, R regular, N niche.
# `phase` is when the feature first ships; `note` records staged delivery.
# `device: true|false` overrides whether acceptance needs the reference device (default: the name or
# test mentions "device"); such features stay device-pending until a fresh device report covers them.

areas:
  PLT: Platform, install, offline, lifecycle
  PRJ: Projects and persistence
  SCN: Scene and objects
  PRM: Primitives and creation
  IMP: Import
  NAV: Navigation and input
  STK: Stroke engine
  BRS: Brushes
  SYM: Symmetry
  TOP: Topology and detail
  FLT: Filters
  MSK: Masking, selection, visibility
  XFM: Transforms
  BOO: Booleans and trimming
  PNT: Paint, materials, viewport look
  LYR: Sculpt layers
  UND: Undo and redo
  EXP: Export and sharing

phases: [P0, P1a, P1b, P2, P3, P4, P5, P6, P7]
# The phase being built now. Controls may only render for features of this phase or earlier
# (invariant 7, scripts/check-ui.mjs); feature status is reported up to it (scripts/feature-status.mjs).
current_phase: P1b

universal_gates:
  - undoable and journaled (once UND-1 and PRJ-3 exist)
  - symmetric where meaningful (SYM-1)
  - mask-respecting (from P2, when MSK-1 lands)
  - mesh validator passes after every operation in tests
brush_gates:
  - golden profile on a reference plane or sphere
  - mask immunity (from P2)
  - mirror exactness 1e-6
  - no NaN or degenerate triangles
  - ms per dab at the reference mesh on the reference device

features:
  # ---------- PLT ----------
  - {id: PLT-1, tier: D, phase: P1a, name: Home Screen install, done_when: "Add to Home Screen, open once online; 'Ready offline' only after every file is SHA-verified; standalone in both orientations", test: "manifest lint; device checklist"}
  - {id: PLT-2, tier: D, phase: P1a, name: "Offline cold launch, on-device only", done_when: "Airplane-mode cold launch reopens the last project in <= 3 s (1M tris); every feature works offline; only network use is the own-file update check, with a Settings toggle (off -> manual button)", test: "WebKit offline e2e runs the full suite offline; e2e network log: non-own-origin requests = 0; bundle audit"}
  - {id: PLT-3, tier: D, phase: P1a, note: "basic in P1a, full in P1b", name: Safe updates, done_when: "Downloads silently; activates on a clean cold launch; immutable versions; two failed boots revert; migrations copy-on-write until the version is marked good", test: "e2e v1 -> v2 -> bad v3 -> auto-revert"}
  - {id: PLT-4, tier: D, phase: P1b, name: Persistent storage, done_when: "persist() requested at first save; usage and quota shown", test: "diagnostics numbers"}
  - {id: PLT-5, tier: D, phase: P1a, name: Lifecycle safety, done_when: "Durability never relies on lifecycle events; a killed or silently reloaded app reopens to the same project; on resume, GL context loss or a blank canvas (1-pixel readback) rebuilds the GPU mirror in <= 1 s", test: "device: 20 background/resume cycles; balloon-kill loop"}
  - {id: PLT-6, tier: D, phase: P1b, name: Browser-gesture suppression, done_when: "No page zoom, scroll, selection, callout, magnifier or back-swipe while sculpting", test: "counts of viewport-scale changes, scrolls, selections, contextmenu, pointercancel = 0 over a scripted checklist"}
  - {id: PLT-7, tier: D, phase: P1a, name: Engine crash containment, done_when: "A WASM trap leaves the UI alive and reports it; the engine restarts in-session if re-instantiation is safe (S1), otherwise 'Saved. Swipe-close and reopen'", test: "injected trap -> recovered hash = last journaled"}
  - {id: PLT-8, tier: D, phase: P1b, name: Device budgets, done_when: "Lab-measured class prior + speed benchmark + adaptive learning; every limit shown with its source; over-budget operations refused before they run", test: "diagnostics; pre-flight refusal tests"}
  - {id: PLT-9, tier: R, phase: P0, name: Diagnostics, done_when: "Capabilities, benchmarks, storage, memory ledger, crash log; JSON shared via the share sheet or AirDrop, never auto-posted", test: "itself"}
  - {id: PLT-10, tier: D, phase: P1a, name: Idle is free, done_when: "Nothing changing -> no frames rendered and no engine work", test: "frame counter over a 10 s idle window = 0"}
  - {id: PLT-11, tier: D, phase: P1b, name: Disk-full policy, done_when: "Low quota or disk blocks growth-causing edits with a banner and offers backup or purge; never a half-written project", test: "quota-fill e2e"}
  - {id: PLT-12, tier: D, phase: P1a, name: On-device crash log, done_when: "Unclean exits, context losses and memory high-water at exit are recorded and shown in Diagnostics", test: "balloon kill -> log entry present"}
  - {id: PLT-13, tier: D, phase: P1a, name: Storage-unavailable mode, done_when: "If OPFS is unavailable (private browsing, ephemeral contexts), the app says so before any work starts and never pretends to save", test: "WebKit ephemeral context e2e: warning shown, no silent save"}

  # ---------- PRJ ----------
  - {id: PRJ-1, tier: D, phase: P1b, note: "basic in P1b, full in P2", name: Gallery, done_when: "Thumbnails, name, date, size, polys; new, open, rename, duplicate, delete (+30-day Recently Deleted)", test: e2e}
  - {id: PRJ-2, tier: D, phase: P1a, name: Project format, done_when: "Node-chunked binary + JSON manifest, per-chunk checksums, schema version and migrations", test: "round-trip hash; migration fixtures"}
  - {id: PRJ-3, tier: D, phase: P1a, name: Journal and incremental checkpoints, done_when: "Stroke after-state durable p99 <= 100 ms after stroke end; undo/redo journaled; dirty-node checkpoint when idle >= 2 s or journal > max(64 MB, compressed mesh); no save-caused frame > 20 ms", test: "device trace"}
  - {id: PRJ-4, tier: D, phase: P1a, name: Crash recovery, done_when: "Checkpoint + journal; stops at the first bad record and reports 'recovered to stroke N'", test: "200 native + 20 WebKit (SIGKILL) + 10 device balloon kills: recovered = last acknowledged"}
  - {id: PRJ-5, tier: D, phase: P1b, name: Project file in/out, done_when: ".maquette file via share sheet <-> Files; re-import hash-identical", test: e2e}
  - {id: PRJ-6, tier: D, phase: P1b, name: Back up all + reminder, done_when: "One zip of all projects; gallery shows days since last backup (the iPad holds the only copy)", test: e2e}
  - {id: PRJ-7, tier: R, phase: P6, name: Named versions, done_when: "Save a version; restore as a new project", test: e2e}
  - {id: PRJ-8, tier: R, phase: P5, name: Storage manager, done_when: "Per-project size; purge spill and journals", test: e2e}
  - {id: PRJ-9, tier: D, phase: P1b, name: Units and import-scale detection, done_when: "Project units (mm/cm/m); import guesses units from the bounding box and asks; drives STL mm", test: fixtures}
  - {id: PRJ-10, tier: D, phase: P1a, name: View and tool state, done_when: "Camera, active tool and brush settings saved separately from the mesh journal", test: "relaunch e2e"}
  - {id: PRJ-11, tier: R, phase: P1b, name: Preferences and presets file, done_when: "Global settings and brush presets survive projects and updates", test: e2e}

  # ---------- SCN / PRM ----------
  - {id: SCN-1, tier: D, phase: P2, name: Multiple objects, done_when: "Add, tap-select, hide, rename, duplicate, delete, outliner; only the active object sculpts", test: e2e}
  - {id: SCN-2, tier: R, phase: P3, name: Merge / separate loose parts, done_when: "Counts conserved; attributes carried", test: unit}
  - {id: SCN-3, tier: N, phase: P7, name: "Instances, hierarchy, repeaters, lattice", done_when: "Deferred: kitbashing and stylized work, not single-piece sculpting", test: "-"}
  - {id: SCN-4, tier: N, phase: P7, name: Live link to Blender, done_when: "Deferred: the share sheet covers the hand-off", test: "-"}
  - {id: PRM-1, tier: D, phase: P1a, name: Quad sphere, done_when: "All-quad cube-sphere; resolution slider shows polys; radius error < 0.5%", test: unit}
  - {id: PRM-2, tier: D, phase: P2, name: Other primitives, done_when: "Cube, cylinder, cone, torus, plane, capsule, icosphere; parametric until first sculpt; watertight (plane: boundary)", test: "unit per primitive"}
  - {id: PRM-3, tier: R, phase: P6, name: Tube / Lathe from a curve, done_when: "Radius profile along a drawn curve; lathe revolve", test: "unit + e2e"}
  - {id: PRM-4, tier: R, phase: P6, name: Extract shell from mask, done_when: "Watertight; thickness slider", test: unit}

  # ---------- IMP ----------
  - {id: IMP-0, tier: D, phase: P1b, name: Import cleanup, done_when: "Orient each component, split non-manifold edges/verts, drop duplicate and degenerate faces, report counts", test: "defect fixtures"}
  - {id: IMP-1, tier: D, phase: P1b, note: "groups merged in P1b; groups -> objects in P2", name: OBJ import, done_when: "Picker without an accept filter (extension checked in JS), drag-and-drop; tris/quads/n-gons kept as polygon runs; vertex colors", test: "Blender-made fixtures: counts exact"}
  - {id: IMP-2, tier: D, phase: P1b, name: STL import, done_when: "Binary and ASCII; tolerance weld", test: "fixtures: weld count exact"}
  - {id: IMP-3, tier: R, phase: P4, name: PLY import, done_when: "Binary and ASCII with colors", test: fixtures}
  - {id: IMP-4, tier: R, phase: P4, name: glTF / GLB import, done_when: "Meshes, node transforms, vertex colors", test: fixtures}
  - {id: IMP-5, tier: R, phase: P4, name: Large streaming import, done_when: "Sliced parse, no UI freeze; 2M-tri OBJ <= 8 s on the reference device; over budget -> offer decimate-to-budget", test: "device perf"}
  - {id: IMP-6, tier: R, phase: P4, name: Import report and repair, done_when: "Holes, scale, one-tap fixes, voxel rebuild", test: "defect fixtures"}
  - {id: IMP-7, tier: D, phase: P3, name: Reference images, done_when: "Photo plane: opacity, lock, snap to front/side/top", test: e2e}
  - {id: IMP-8, tier: N, phase: P7, name: "FBX, USDZ import", done_when: "Deferred: OBJ/GLB cover Blender and ZBrush round-trips", test: "-"}

