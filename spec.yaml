  - {id: STK-5, tier: R, phase: P2, name: Screen / world radius, done_when: "Both modes behave per definition", test: unit}
  - {id: STK-6, tier: D, phase: P3, name: "Front faces only, connected only", done_when: "Thin plate: back untouched; overlapping shells: only the hit shell moves", test: unit}
  - {id: STK-7, tier: R, phase: P4, name: Alphas / stamps, done_when: "Grayscale alpha in the tangent frame; fixed/follow/random rotation; PNG import", test: "golden height image"}
